name = "makeover-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Daily usage counters
[[kv_namespaces]]
binding = "USAGE"
id = "d513523c687f4f39896b58aad1579a29"

# Saved designs: details in D1, full images in KV
[[d1_databases]]
binding = "DB"
database_name = "makeover-db"
database_id = "1cb0ddf7-6bc0-48de-a7a0-a57e921f11eb"

[[kv_namespaces]]
binding = "DESIGN_IMAGES"
id = "dad895ecfb7a45dbb36f2d03fdc5e79c"

[vars]
ALLOWED_ORIGINS = "https://atefnansi-max.github.io"
# Free generations per day for the whole site and for each visitor (each Generate, Refine or angle is one)
DAILY_LIMIT_SITE = "60"
DAILY_LIMIT_PER_VISITOR = "15"
